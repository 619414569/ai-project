name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  error-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate error notebook
        run: node 619414569文件夹-测试/check-error-notebook.mjs
      - name: Enforce release error notebook gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: node 619414569文件夹-测试/check-error-notebook.mjs --release

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 619414569文件夹-应用/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test backend
        run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 619414569文件夹-应用/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  container-images:
    runs-on: ubuntu-latest
    needs: [error-notebook, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ai-scaffold-backend:ci ./619414569文件夹-应用/backend
      - name: Build frontend image
        run: docker build -t ai-scaffold-frontend:ci ./619414569文件夹-应用/frontend
