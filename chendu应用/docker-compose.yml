name: ai-scaffold-chendu

# 同机部署：本应用只启动前端与后端容器。
# PostgreSQL、Redis、RocketMQ 复用同服务器上 619414569应用 的 compose 已启动的容器，
# 通过其外部网络 ai-scaffold_ai-network 按服务名访问，不重复起中间件容器。
services:
  backend:
    build:
      context: ./backend
    image: ai-scaffold-chendu-backend:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      # 共享 PostgreSQL 实例中为本应用单独创建的库与角色
      DB_URL: "${DB_URL:?DB_URL is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      # 共享 Redis：口令必须与 619414569应用 的 REDIS_PASSWORD 一致
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      # 共享 RocketMQ NameServer；消费组独立，避免与 619414569应用 争抢同一队列
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-rocketmq-namesrv:9876}
      ROCKETMQ_PRODUCER_GROUP: ${ROCKETMQ_PRODUCER_GROUP:-ai-scaffold-chendu-producer}
      ROCKETMQ_CONSUMER_GROUP: ${ROCKETMQ_CONSUMER_GROUP:-ai-scaffold-chendu-consumer}
      ROCKETMQ_DEMO_TOPIC: ${ROCKETMQ_DEMO_TOPIC:-ai-scaffold-demo}
      ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-true}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ISSUER: ${JWT_ISSUER:-ai-scaffold}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT2H}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@123456}
      DEMO_ADMIN_ROLES: ${DEMO_ADMIN_ROLES:-ADMIN,USER}
      DEMO_DCY_USERNAME: ${DEMO_DCY_USERNAME:-dcy}
      DEMO_DCY_PASSWORD: ${DEMO_DCY_PASSWORD:-admin123}
      DEMO_DCY_ROLES: ${DEMO_DCY_ROLES:-USER}
      APP_DEMO_DATA_ENABLED: ${APP_DEMO_DATA_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:81,http://127.0.0.1,http://127.0.0.1:81}
      CORS_ALLOWED_ORIGIN_PATTERNS: '${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.1[6-9].*:*,http://172.2[0-9].*:*,http://172.3[01].*:*}'
    ports:
      # 仅绑定回环地址，供宿主机排查 actuator；浏览器访问走前端 Nginx
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - chendu-network
      - shared-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    image: ai-scaffold-chendu-frontend:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    ports:
      # 对外入口；619414569应用 已占用 80，本应用使用 81
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-81}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - chendu-network

networks:
  # 本应用内部：前端反向代理到后端
  chendu-network:
    driver: bridge
  # 由 619414569应用 的 compose（项目名 ai-scaffold，网络键 ai-network）创建
  # 实际网络名为 ai-scaffold_ai-network；用 docker network ls 核对后再部署
  shared-network:
    external: true
    name: ${SHARED_NETWORK_NAME:-ai-scaffold_ai-network}
