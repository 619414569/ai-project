name: ai-scaffold

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_scaffold}
      POSTGRES_USER: ${POSTGRES_USER:-ai_scaffold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ai-network

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: -server -Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    networks:
      - ai-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: -server -Xms512m -Xmx512m -Xmn256m
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
    networks:
      - ai-network

  backend:
    build:
      context: ./backend
    image: ai-scaffold-backend:local
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_scaffold}
      DB_USERNAME: ${POSTGRES_USER:-ai_scaffold}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret-with-a-random-64-character-value}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT2H}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@123456}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - ai-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    image: ai-scaffold-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - ai-network

volumes:
  postgres_data:
  redis_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_broker_store:

networks:
  ai-network:
    driver: bridge
