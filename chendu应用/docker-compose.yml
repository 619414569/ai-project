name: notebook

# 不单独建网络，直接接入 619414569应用 的 compose 已创建的 ai-scaffold_ai-network。
# 服务名带 notebook- 前缀：该网络里已有 619414569应用 的 backend / frontend，
# 同名别名会让 Docker DNS 返回多个 A 记录，可能把请求转发到另一个应用。
services:
  notebook-backend:
    # 后端镜像是单阶段构建，依赖宿主机先产出 jar，因此由 scripts/deploy.sh 先 docker build，
    # 这里只引用镜像、不参与 compose build（compose 无法执行 mvn）。
    image: notebook-backend:local
    restart: unless-stopped
    # 仅回环地址，供本机排查 /actuator/health；浏览器访问走前端 Nginx
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - ai-scaffold_ai-network

  notebook-frontend:
    build: ./frontend
    image: notebook-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_URL: http://notebook-backend:8080
    ports:
      - "81:80"
    depends_on:
      - notebook-backend
    networks:
      - ai-scaffold_ai-network

networks:
  ai-scaffold_ai-network:
    external: true
